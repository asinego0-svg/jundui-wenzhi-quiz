<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>军队文职备考 · 在线题库</title>
<style>
:root{--bg:#0f1923;--bg-card:#162231;--bg-card2:#1a2d3d;--gold:#c9a84c;--red:#e74c3c;--green:#2ecc71;--blue:#3498db;--text:#e0e0e0;--text-dim:#8899aa;--border:#2a3d52}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav{display:flex;gap:2px;background:#0a1219;padding:8px 12px;overflow-x:auto;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.nav-link{padding:8px 16px;border-radius:6px;color:var(--text-dim);text-decoration:none;font-size:14px;white-space:nowrap;transition:all .2s}
.nav-link:hover,.nav-link.active{background:var(--bg-card);color:var(--gold)}
.nav-user{margin-left:auto;padding:8px 14px;border-radius:6px;color:var(--text-dim);font-size:13px;white-space:nowrap;cursor:pointer;transition:all .2s;flex-shrink:0}
.nav-user:hover{background:var(--bg-card);color:var(--gold)}
.container{max-width:900px;margin:0 auto;padding:20px 16px}
/* Wider container on large screens - utilize the space */
@media(min-width:1100px){.container{max-width:1200px}}
@media(min-width:1600px){.container{max-width:1400px}}
/* Slightly larger question-number dot on wide screens */
@media(min-width:1100px){.q-dot{width:30px;height:30px;font-size:12px}}
/* Two-column quiz layout on very wide screens: question+options left, question-nav right */
@media(min-width:1500px){
  .quiz-wide{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
  .quiz-wide .question-nav{position:sticky;top:80px;max-height:calc(100vh - 120px);overflow-y:auto;padding-right:8px;margin-bottom:0;flex-wrap:wrap;align-content:flex-start}
}
.card{background:var(--bg-card);border-radius:12px;padding:24px;margin-bottom:16px;border:1px solid var(--border)}
h2{font-size:20px;margin-bottom:16px;color:var(--gold)}
h3{font-size:16px;margin-bottom:12px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
.btn-gold{background:var(--gold);color:#0f1923}
.btn-gold:hover{background:#d4b356}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--bg-card2)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
select,input[type=number]{padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px}
label{font-size:13px;color:var(--text-dim);margin-right:8px}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.option{cursor:pointer;padding:10px 14px;border-radius:8px;border:1px solid var(--border);display:block;margin-bottom:8px;transition:all .15s}
.option:hover{border-color:var(--gold)}
.option.selected{border-color:var(--gold);background:rgba(201,168,76,.1)}
.option.correct{border-color:var(--green);background:rgba(46,204,113,.1)}
.option.wrong{border-color:var(--red);background:rgba(231,76,60,.1)}
.option.correct-show{border-color:var(--green);background:rgba(46,204,113,.08)}
.feedback{padding:12px;border-radius:8px;margin:12px 0;font-size:14px}
.feedback.correct{background:rgba(46,204,113,.1);color:var(--green)}
.feedback.wrong{background:rgba(231,76,60,.1);color:var(--red)}
.progress-text{font-size:13px;color:var(--text-dim);margin-bottom:12px}
.stat-card{background:var(--bg-card2);border-radius:8px;padding:16px;text-align:center}
.stat-card .num{font-size:28px;font-weight:700;color:var(--gold)}
.stat-card .label{font-size:12px;color:var(--text-dim);margin-top:4px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.year-card{background:var(--bg-card2);border-radius:8px;padding:16px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.year-card:hover{border-color:var(--gold)}
.year-card .year{font-size:18px;font-weight:700;color:var(--gold)}
.year-card .info{font-size:13px;color:var(--text-dim);margin-top:6px}
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.timer{font-size:36px;font-weight:700;text-align:center;padding:16px;color:var(--gold)}
.timer.warning{color:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.question-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.q-dot{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all .15s}
.q-dot.answered{background:var(--blue);border-color:var(--blue);color:#fff}
.q-dot.current{border-color:var(--gold);background:rgba(201,168,76,.15)}
.q-dot.correct-dot{background:var(--green);border-color:var(--green);color:#fff}
.q-dot.wrong-dot{background:var(--red);border-color:var(--red);color:#fff}
.score-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin:8px 0}
.score-fill{height:100%;border-radius:4px;transition:width .5s}
.tab-content{display:none}
.tab-content.active{display:block}
.loading{text-align:center;padding:40px;color:var(--text-dim)}
.spinner{border:3px solid var(--border);border-top:3px solid var(--gold);border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.tag{padding:3px 8px;border-radius:4px;font-size:11px;display:inline-block}
.tag-single{background:rgba(52,152,219,.15);color:var(--blue)}
.tag-multi{background:rgba(201,168,76,.15);color:var(--gold)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--red);color:#fff;margin-left:6px}
.empty-state{text-align:center;padding:40px;color:var(--text-dim)}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-card);border-radius:16px;padding:32px;max-width:500px;width:90%;border:1px solid var(--border);text-align:center}
.modal h2{font-size:22px;margin-bottom:16px}
.modal .score-big{font-size:64px;font-weight:700;color:var(--gold);margin:16px 0}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:120px;margin:16px 0}
.bar{flex:1;border-radius:4px 4px 0 0;min-width:20px;transition:height .5s}
.heatmap-cell{border-radius:3px;display:inline-block;width:20px;height:20px;margin:2px}
.heatmap-cell.l0{background:var(--bg-card2)}
.heatmap-cell.l1{background:rgba(46,204,113,.15)}
.heatmap-cell.l2{background:rgba(46,204,113,.3)}
.heatmap-cell.l3{background:rgba(46,204,113,.5)}
.heatmap-cell.l4{background:rgba(46,204,113,.7)}
.fav-note{width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;margin-top:8px;resize:vertical}
.note-inline{color:var(--text-dim);font-size:12px;margin-top:4px;font-style:italic}
.exam-review-q{padding:16px;background:var(--bg-card2);border-radius:8px;margin-bottom:12px;border-left:3px solid var(--border)}
.exam-review-q.correct-r{border-left-color:var(--green)}
.exam-review-q.wrong-r{border-left-color:var(--red)}
.history-item{padding:12px;background:var(--bg-card2);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
/* Mobile responsive */
@media(max-width:600px){
  .container{padding:12px 8px}
  .card{padding:16px}
  .filter-bar{gap:6px}
  .btn{padding:8px 14px;font-size:13px}
  .exam-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .timer{font-size:28px}
  /* Knowledge cards */
  .kp-card{background:var(--bg-main);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px;cursor:pointer;transition:all 0.2s}
  .kp-card:hover{border-color:var(--gold);box-shadow:0 2px 12px rgba(0,0,0,0.1)}
  .kp-card.mastered{opacity:0.6;border-color:var(--green)}
  .kp-card.mastered .kp-badge{background:var(--green);color:#fff}
  .kp-question{font-size:16px;font-weight:600;line-height:1.7}
  .kp-answer{display:none;margin-top:14px;padding:14px;background:var(--bg);border-radius:8px;font-size:14px;line-height:1.8;color:var(--text)}
  .kp-card.open .kp-answer{display:block}
  .kp-meta{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .kp-badge{font-size:11px;padding:3px 8px;border-radius:12px;background:var(--bg);color:var(--text-dim)}
  .kp-actions{display:flex;gap:8px}
  /* Sticky quiz controls on mobile so "next" button is always reachable */
  .quiz-controls{
    position:sticky;
    bottom:0;
    background:var(--bg-card);
    padding:10px 0;
    margin-top:8px;
    z-index:10;
    border-top:1px solid var(--border);
  }
  /* Feedback area should not push button too far down */
  #quiz-feedback{margin-bottom:4px}
}
</style>
</head>
<body>
<nav class="nav" id="navbar">
  <a href="#dashboard" class="nav-link active" data-tab="dashboard">学习仪表盘</a>
  <a href="#practice" class="nav-link" data-tab="practice">答题练习</a>
  <a href="#exams" class="nav-link" data-tab="exams">历年真题</a>
  <a href="#wrong" class="nav-link" data-tab="wrong">错题本</a>
  <a href="#fav" class="nav-link" data-tab="fav">收藏夹</a>
  <a href="#stats" class="nav-link" data-tab="stats">学习统计</a>
  <a href="#knowledge" class="nav-link" data-tab="knowledge">📖 知识点</a>
  <span class="nav-user" id="nav-user" onclick="openSettings()" title="点击设置/切换用户">👤 <span id="nav-username">未登录</span></span>
</nav>
<div class="container">
  <!-- Dashboard -->
  <div id="tab-dashboard" class="tab-content active">
    <div class="card"><h2>军队文职备考 · 在线题库</h2>
      <div class="stat-row" id="dash-stats"></div>
      <div style="margin-top:16px">
        <button class="btn btn-gold" onclick="switchTab('practice')">开始答题</button>
        <button class="btn btn-outline" onclick="switchTab('exams')" style="margin-left:10px">模拟考试</button>
      </div>
    </div>
    <div class="card"><h3>各模块正确率</h3><div id="dash-modules"></div></div>
    <div class="card"><h3>最近学习热力图</h3><div id="dash-heatmap"></div></div>
  </div>
  
  <!-- Practice -->
  <div id="tab-practice" class="tab-content">
    <div class="card">
      <h2>答题练习 <span id="q-progress" class="progress-text"></span></h2>
      <div class="filter-bar">
        <label>模块:</label><select id="filter-module"><option value="">全部</option></select>
        <label>抽题:</label><select id="filter-mode"><option value="random">随机</option><option value="seq">顺序</option><option value="wrong">错题</option><option value="fav">收藏</option></select>
        <label>题数:</label><input type="number" id="filter-count" value="30" min="5" max="500" style="width:80px">
        <label>刷题:</label><select id="practice-mode"><option value="study">背题模式</option><option value="practice">练习模式</option></select>
        <button class="btn btn-gold btn-sm" onclick="startPractice()">开始</button>
      </div>
      <div class="quiz-wide">
        <div>
          <div id="quiz-area"></div>
          <div id="quiz-feedback"></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center" class="quiz-controls">
            <button class="btn btn-gold" id="btn-submit" onclick="submitAnswer()">提交答案</button>
            <button class="btn btn-gold" id="btn-submit-mul" onclick="submitMultiAnswer()" style="display:none">确认答案</button>
            <button class="btn btn-outline btn-sm" id="btn-prev" onclick="prevQuestion()" style="display:none">⬅ 上一题</button>
            <button class="btn btn-outline" id="btn-next" onclick="nextQuestion()" style="display:none">下一题 ➡</button>
            <button class="btn btn-outline btn-sm" id="btn-fav" onclick="toggleFav()" style="display:none" title="收藏/取消收藏">⭐</button>
            <button class="btn btn-outline btn-sm" id="btn-end" onclick="endPractice()">结束</button>
          </div>
          <textarea class="fav-note" id="fav-note" placeholder="添加笔记..." style="display:none"></textarea>
        </div>
        <div>
          <h3 style="font-size:14px;color:var(--text-dim);margin-bottom:8px">题号导航</h3>
          <div class="question-nav" id="q-nav"></div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Exams -->
  <div id="tab-exams" class="tab-content">
    <div class="card"><h2>历年真题 · 模拟考试</h2><div class="exam-grid" id="exam-list"></div></div>
    <div id="exam-area"></div>
    <div id="exam-review"></div>
  </div>
  
  <!-- Wrong Book -->
  <div id="tab-wrong" class="tab-content">
    <div class="card"><h2>错题本</h2><div id="wrong-content"></div></div>
  </div>
  
  <!-- Favorites -->
  <div id="tab-fav" class="tab-content">
    <div class="card"><h2>收藏夹</h2><div id="fav-content"></div></div>
  </div>
  
  <!-- Stats -->
  <div id="tab-stats" class="tab-content">
    <div class="card"><h2>学习统计</h2><div id="stats-content"></div></div>
  </div>
  <div id="tab-knowledge" class="tab-content">
    <div class="card"><h2>知识点背诵</h2>
      <div class="filter-bar" style="margin-bottom:12px">
        <label>模块:</label><select id="kp-module"><option value="">全部</option></select>
        <label>掌握:</label><select id="kp-mastery"><option value="">全部</option><option value="mastered">已掌握</option><option value="unmastered">未掌握</option></select>
        <button class="btn btn-gold btn-sm" onclick="loadKnowledge()">刷新</button>
        <span style="margin-left:auto;font-size:13px" id="kp-progress"></span>
      </div>
      <div id="kp-cards"></div>
      <div style="text-align:center;margin-top:12px" id="kp-pager"></div>
    </div>
  </div>
</div>

<!-- Result Modal -->
<div class="modal-overlay" id="result-modal">
  <div class="modal"><h2 id="modal-title"></h2>
    <div class="score-big" id="modal-score"></div>
    <div id="modal-detail"></div>
    <button class="btn btn-gold" onclick="closeModal()" style="margin-top:16px">确 定</button>
  </div>
</div>

<!-- Login Modal (username only) -->
<div class="modal-overlay" id="login-modal">
  <div class="modal">
    <h2>👤 欢迎使用</h2>
    <p style="color:var(--text-dim);margin-bottom:20px">输入用户名即可开始答题，无需注册</p>
    <input type="text" id="login-username" placeholder="请输入用户名" style="width:80%;padding:12px 16px;font-size:16px;border:1px solid var(--border);border-radius:8px;background:var(--bg-main);color:var(--text);text-align:center" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="login-error" style="color:var(--red);margin-top:8px;font-size:13px"></div>
    <button class="btn btn-gold" onclick="doLogin()" style="margin-top:16px;width:80%">开 始 答 题</button>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal" style="text-align:left;max-width:520px">
    <h2 style="text-align:center">⚙️ 设置</h2>
    <div style="margin:20px 0">
      <label style="color:var(--text-dim);font-size:13px">当前用户</label>
      <div style="display:flex;gap:8px;margin-top:6px;align-items:center">
        <input type="text" id="settings-username" placeholder="用户名" style="flex:1;padding:10px 14px;font-size:15px;border:1px solid var(--border);border-radius:8px;background:var(--bg-main);color:var(--text)">
        <button class="btn btn-outline btn-sm" onclick="switchUser()">切换</button>
      </div>
    </div>
    <hr style="border:none;border-top:1px solid var(--border);margin:20px 0">
    <div style="margin:20px 0">
      <label style="color:var(--text-dim);font-size:13px">跨设备云端同步</label>
      <p style="color:var(--text-dim);font-size:12px;margin-top:4px">进度自动同步到云端，换电脑/手机登录同名即可保持进度</p>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="btn btn-gold btn-sm" onclick="syncNow()">立即同步</button>
      </div>
      <div id="sync-status" style="margin-top:8px;font-size:13px;color:var(--text-dim)"></div>
    </div>
    <hr style="border:none;border-top:1px solid var(--border);margin:20px 0">
    <div style="text-align:center">
      <button class="btn btn-outline" onclick="closeSettings()">关 闭</button>
    </div>
  </div>
</div>

<script>
// ====== DATA LOADING ======
let QUIZ_DATA = [];
let EXAM_DATA = [];
let dataLoaded = false;

async function loadData() {
  document.getElementById('dash-stats').innerHTML = '<div class="loading"><div class="spinner"></div>加载题库数据...</div>';
  try {
    const [quizResp, examResp] = await Promise.all([
      fetch('quiz_data.json'),
      fetch('exams.json')
    ]);
    QUIZ_DATA = await quizResp.json();
    EXAM_DATA = await examResp.json();
    // Normalize quiz data: convert array-based options/answer to object/letter-string
    const LETTERS = ['A','B','C','D','E','F'];
    QUIZ_DATA.forEach(q => {
      if (Array.isArray(q.options)) {
        const obj = {};
        q.options.forEach((opt, i) => { if (i < LETTERS.length) obj[LETTERS[i]] = opt; });
        q.options = obj;
      }
      if (Array.isArray(q.answer)) {
        q.answer = q.answer.map(idx => LETTERS[idx] || '').sort().join('');
      }
    });
    // Normalize exam data the same way (in case some are arrays)
    EXAM_DATA.forEach(exam => {
      if (exam.questions) exam.questions.forEach(q => {
        if (Array.isArray(q.options)) {
          const obj = {};
          q.options.forEach((opt, i) => { if (i < LETTERS.length) obj[LETTERS[i]] = opt; });
          q.options = obj;
        }
        if (Array.isArray(q.answer)) {
          q.answer = q.answer.map(idx => LETTERS[idx] || '').sort().join('');
        }
      });
    });
    dataLoaded = true;
    console.log('Loaded ' + QUIZ_DATA.length + ' quiz questions, ' + EXAM_DATA.length + ' exam papers');
    initApp();
  } catch(e) {
    document.getElementById('dash-stats').innerHTML = '<div class="empty-state"><p>数据加载失败，请刷新页面重试</p><p style="color:var(--text-dim);font-size:12px">' + e.message + '</p></div>';
  }
}

// ====== STATE ======
const SUPABASE_URL = 'https://xvzpmtvrgrhdcomjhjeb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JaoWlfSRLkhr-m7qoI8_9A_PZ_gqHsm';
let currentUser = '';
let syncTimer = null;

let state = {
  practice: { questions: [], currentIdx: 0, answers: {}, score: 0, total: 0, completed: false, mode: 'study' },
  wrongBook: {},
  favorites: {},
  history: {},
  dailyStats: {},
  moduleStats: {},
  examActive: null,
  examHistory: {},
  knowledgeMastered: {}  // knowledge point mastery: {kp_id: true}
};

function getStorageKey() {
  return currentUser ? `army_exam_prep_${currentUser}` : 'army_exam_prep';
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(getStorageKey()) || '{}');
    state.wrongBook = saved.wrongBook || {};
    state.favorites = saved.favorites || {};
    state.history = saved.history || {};
    state.dailyStats = saved.dailyStats || {};
    state.moduleStats = saved.moduleStats || {};
    state.examHistory = saved.examHistory || {};
  } catch(e) {}
}
function saveState() {
  const data = {
    wrongBook: state.wrongBook, favorites: state.favorites,
    history: state.history, dailyStats: state.dailyStats,
    moduleStats: state.moduleStats, examHistory: state.examHistory,
    knowledgeMastered: state.knowledgeMastered,
    lastSaved: new Date().toISOString()
  };
  localStorage.setItem(getStorageKey(), JSON.stringify(data));
  // Debounced sync to GitHub
  scheduleSync();
}

function scheduleSync() {
  if (!currentUser) return;
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncToSupabase(true), 3000); // 3s debounce
}

// ====== USER MANAGEMENT ======
function initUser() {
  currentUser = localStorage.getItem('wenzhi_user') || '';
  if (!currentUser) {
    document.getElementById('login-modal').classList.add('show');
    document.getElementById('login-username').focus();
    return false;
  }
  updateNavUser();
  return true;
}

function doLogin() {
  const name = document.getElementById('login-username').value.trim();
  const err = document.getElementById('login-error');
  if (!name) { err.textContent = '请输入用户名'; return; }
  if (name.length > 20) { err.textContent = '用户名最多20个字符'; return; }
  currentUser = name;
  localStorage.setItem('wenzhi_user', name);
  document.getElementById('login-modal').classList.remove('show');
  updateNavUser();
  loadState();
  // Load from Supabase cloud
  loadFromSupabase();
  // Refresh UI
  if (dataLoaded) {

// ====== SUPABASE SYNC ======
async function syncToSupabase(isAuto) {
  if (!currentUser) return;
  const payload = {
    wrongBook: state.wrongBook, favorites: state.favorites,
    history: state.history, dailyStats: state.dailyStats,
    moduleStats: state.moduleStats, examHistory: state.examHistory,
    knowledgeMastered: state.knowledgeMastered,
    lastSaved: new Date().toISOString()
  };
  const statusEl = document.getElementById('sync-status');
  if (isAuto && statusEl) statusEl.innerHTML = '🔄 同步中...';

  try {
    // Always use POST + upsert (merge-duplicates) - handles both create and update
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/user_progress`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Accept': 'application/json',
        'Prefer': 'return=minimal,resolution=merge-duplicates'
      },
      body: JSON.stringify({ username: currentUser, data: payload, updated_at: new Date().toISOString() })
    });

    if (resp.ok || resp.status === 201) {
      if (statusEl) statusEl.innerHTML = `🟢 已同步（${new Date().toLocaleTimeString()}）`;
    } else {
      const errText = await resp.text().catch(() => '');
      console.error('Supabase sync error:', resp.status, errText);
      if (statusEl) statusEl.innerHTML = `🔴 同步失败(${resp.status})，进度已保存在本地`;
    }
  } catch(e) {
    console.error('Supabase network error:', e);
    if (statusEl) statusEl.innerHTML = '🔴 网络错误，进度已保存在本地';
  }
}

async function loadFromSupabase() {
  if (!currentUser) return;
  try {
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/user_progress?username=eq.${encodeURIComponent(currentUser)}&select=data,updated_at`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    if (!resp.ok) return;
    const rows = await resp.json();
    if (!rows || rows.length === 0) return; // No saved data yet

    const remote = rows[0].data;
    // Merge: remote takes precedence if newer, but keep local unsaved changes
    const localRaw = localStorage.getItem(getStorageKey());
    const local = localRaw ? JSON.parse(localRaw) : {};
    const remoteTime = remote.lastSaved ? new Date(remote.lastSaved).getTime() : 0;
    const localTime = local.lastSaved ? new Date(local.lastSaved).getTime() : 0;

    if (remoteTime > localTime) {
      state.wrongBook = remote.wrongBook || {};
      state.favorites = remote.favorites || {};
      state.history = remote.history || {};
      state.dailyStats = remote.dailyStats || {};
      state.moduleStats = remote.moduleStats || {};
      state.examHistory = remote.examHistory || {};
      localStorage.setItem(getStorageKey(), JSON.stringify(remote));
      if (dataLoaded) { populateFilters(); renderDashboard(); }
    }
  } catch(e) {
    // Silent fail - just use local data
  }
}

async function syncNow() {
  await syncToSupabase(false);
  const el = document.getElementById('sync-status');
  if (el && el.textContent.includes('🟢')) {

// ====== DASHBOARD ======
function renderDashboard() {
  if (!dataLoaded) return;
  const totalQ = QUIZ_DATA.length;
  const wrongCount = Object.keys(state.wrongBook).length;
  const favCount = Object.keys(state.favorites).length;
  const days = Object.keys(state.dailyStats).length;
  const totalAnswered = Object.values(state.history).reduce((a,b) => a + (b.correct||0) + (b.wrong||0), 0);
  
  document.getElementById('dash-stats').innerHTML = `
    <div class="stat-card"><div class="num">${totalQ}</div><div class="label">题库总题数</div></div>
    <div class="stat-card"><div class="num">${EXAM_DATA.length}</div><div class="label">历年真题卷</div></div>
    <div class="stat-card"><div class="num">${totalAnswered}</div><div class="label">累计答题</div></div>
    <div class="stat-card"><div class="num" style="color:${wrongCount?'var(--red)':'var(--green)'}">${wrongCount}</div><div class="label">待复习错题</div></div>
    <div class="stat-card"><div class="num">${favCount}</div><div class="label">收藏题目</div></div>
    <div class="stat-card"><div class="num">${days}</div><div class="label">学习天数</div></div>`;
  
  // Module stats
  const modules = {};
  QUIZ_DATA.forEach(q => {
    const m = q.module || '其他';
    if (!modules[m]) modules[m] = {total:0, correct:0, answered:0};
    modules[m].total++;
    const h = state.history[q.id];
    if (h) { modules[m].answered++; if (h.correct) modules[m].correct++; }
  });
  
  let modHtml = '<div style="display:flex;flex-direction:column;gap:10px">';
  for (const [name, data] of Object.entries(modules)) {
    const pct = data.answered > 0 ? Math.round(data.correct/data.answered*100) : 0;
    const progressPct = data.total > 0 ? Math.round(data.answered/data.total*100) : 0;
    const color = pct >= 80 ? 'var(--green)' : pct >= 60 ? 'var(--gold)' : 'var(--red)';
    modHtml += `<div style="display:flex;align-items:center;gap:10px">
      <span style="width:90px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</span>
      <span style="font-size:11px;color:var(--text-dim);width:60px;text-align:center;flex-shrink:0">${data.answered}/${data.total}</span>
      <div class="score-bar" style="flex:1;position:relative"><div class="score-fill" style="width:${pct}%;background:${color}"></div><div style="position:absolute;top:0;left:0;height:100%;width:${progressPct}%;background:rgba(255,255,255,.06);border-radius:4px"></div></div>
      <span style="font-size:13px;width:42px;text-align:right;color:${color};flex-shrink:0">${pct}%</span>
    </div>`;
  }
  modHtml += '</div>';
  document.getElementById('dash-modules').innerHTML = modHtml;
  
  // Heatmap
  renderHeatmap();
}

function renderHeatmap() {
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0,10);
    const stat = state.dailyStats[key];
    days.push({key, count: stat ? stat.total || 0 : 0});
  }
  const maxCount = Math.max(1, ...days.map(d => d.count));
  let html = '<div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">';
  days.forEach(d => {
    const lvl = d.count === 0 ? 0 : d.count <= maxCount*0.25 ? 1 : d.count <= maxCount*0.5 ? 2 : d.count <= maxCount*0.75 ? 3 : 4;
    html += `<span class="heatmap-cell l${lvl}" title="${d.key}: ${d.count}题"></span>`;
  });
  html += '</div>';
  document.getElementById('dash-heatmap').innerHTML = html;
}

// ====== PRACTICE ======
function populateFilters() {
  if (!dataLoaded) return;
  const modules = [...new Set(QUIZ_DATA.map(q => q.module || '其他'))];
  const sel = document.getElementById('filter-module');
  modules.sort().forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    sel.appendChild(opt);
  });
}

function startPractice() {
  const module = document.getElementById('filter-module').value;
  const mode = document.getElementById('filter-mode').value;
  let count = parseInt(document.getElementById('filter-count').value) || 30;
  
  let pool = [...QUIZ_DATA];
  if (module) pool = pool.filter(q => (q.module || '其他') === module);
  
  if (mode === 'wrong') {
    const wrongIds = new Set(Object.keys(state.wrongBook));
    pool = pool.filter(q => wrongIds.has(q.id));
  }
  if (mode === 'fav') {
    const favIds = new Set(Object.keys(state.favorites));
    pool = pool.filter(q => favIds.has(q.id));
  }
  
  if (pool.length === 0) {
    alert('没有符合条件的题目！');
    return;
  }
  
  if (mode === 'random' || mode === 'wrong' || mode === 'fav') {
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
  }
  
  count = Math.min(count, pool.length);
  pool = pool.slice(0, count);
  
  state.practice = {
    questions: pool,
    currentIdx: 0,
    answers: {},
    score: 0,
    total: count,
    completed: false,
    mode: document.getElementById('practice-mode').value || 'study'
  };
  
  document.getElementById('q-progress').textContent = '第 1/' + count + ' 题';
  document.getElementById('quiz-feedback').innerHTML = '';
  
  // In practice mode, hide submit button (auto-advance); in study mode, show it
  const isPractice = state.practice.mode === 'practice';
  document.getElementById('btn-submit').style.display = isPractice ? 'none' : '';
  document.getElementById('btn-submit-mul').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('btn-prev').style.display = 'none';
  document.getElementById('btn-fav').style.display = '';
  document.getElementById('fav-note').style.display = 'none';
  renderQNav();
  renderQuiz();
}

function renderQNav() {
  const p = state.practice;
  let html = '';
  for (let i = 0; i < p.total; i++) {
    let cls = 'q-dot';
    if (i === p.currentIdx) cls += ' current';
    if (p.answers[i] !== undefined) cls += ' answered';
    html += `<span class="${cls}" onclick="jumpTo(${i})">${i+1}</span>`;
  }
  document.getElementById('q-nav').innerHTML = html;
}

function renderQuiz() {
  const p = state.practice;
  if (p.currentIdx >= p.total) { endPractice(); return; }
  
  const q = p.questions[p.currentIdx];
  const userAns = p.answers[p.currentIdx] || '';
  const isAnswered = userAns !== '';
  const isMulti = q.type === 'multi';
  
  document.getElementById('q-progress').textContent = `第 ${p.currentIdx+1}/${p.total} 题`;
  const isPractice = p.mode === 'practice';
  document.getElementById('btn-submit').style.display = (!isAnswered && !isPractice) ? '' : 'none';
  document.getElementById('btn-submit-mul').style.display = (!isAnswered && isPractice && isMulti) ? '' : 'none';
  document.getElementById('btn-next').style.display = isAnswered ? '' : 'none';
  document.getElementById('btn-prev').style.display = p.currentIdx > 0 ? '' : 'none';
  
  // Fav button
  const isFaved = state.favorites[q.id];
  document.getElementById('btn-fav').textContent = isFaved ? '⭐ 已收藏' : '☆ 收藏';
  document.getElementById('fav-note').style.display = isFaved ? '' : 'none';
  if (isFaved) {
    document.getElementById('fav-note').value = typeof isFaved === 'string' ? isFaved : '';
  }
  
  const typeTag = isMulti ? '<span class="tag tag-multi">多选题</span>' : '<span class="tag tag-single">单选题</span>';
  const module = q.module ? `<span style="color:var(--text-dim);font-size:12px">${q.module}</span>` : '';
  
  let html = `<div style="margin-bottom:16px">${typeTag} ${module}</div>`;
  html += `<div style="font-size:16px;line-height:1.6;margin-bottom:16px">${q.question}</div>`;
  
  const labels = isMulti ? ['A','B','C','D','E'] : ['A','B','C','D'];
  labels.forEach(l => {
    if (!q.options[l]) return;
    let cls = 'option';
    if (isAnswered) {
      if (q.answer && q.answer.includes(l)) cls += ' correct-show';
      if (userAns.includes(l) && !(q.answer && q.answer.includes(l))) cls += ' wrong';
      if (userAns.includes(l) && q.answer && q.answer.includes(l)) cls += ' correct';
    } else if (userAns && userAns.includes(l)) {
      cls += ' selected';
    }
    html += `<div class="${cls}" onclick="${isAnswered ? '' : `selectOption('${l}')`}" data-opt="${l}">${l}. ${q.options[l]}</div>`;
  });
  
  document.getElementById('quiz-area').innerHTML = html;
  
  // Restore selections for non-answered
  if (!isAnswered && userAns) {
    // This shouldn't happen normally since we check isAnswered above
  }
  
  renderQNav();
}

function selectOption(label) {
  const p = state.practice;
  const q = p.questions[p.currentIdx];
  const isMulti = q.type === 'multi';
  
  if (isMulti) {
    const current = p.answers[p.currentIdx] || '';
    if (current.includes(label)) {
      p.answers[p.currentIdx] = current.replace(label, '');
    } else {
      p.answers[p.currentIdx] = (current + label).split('').sort().join('');
    }
    // Re-render to update selections
    const labels = ['A','B','C','D','E'];
    document.querySelectorAll('#quiz-area .option').forEach(el => {
      const opt = el.dataset.opt;
      if (opt === label) {
        el.classList.toggle('selected', p.answers[p.currentIdx].includes(label));
      }
    });
  } else {
    p.answers[p.currentIdx] = label;
    document.querySelectorAll('#quiz-area .option').forEach(el => {
      el.classList.toggle('selected', el.dataset.opt === label);
    });
    
    // In study mode, auto-submit for single choice immediately
    if (p.mode === 'study') {
      submitAnswer();
      return;
    }
    
    // In practice mode, auto-advance for single choice after a short delay
    if (p.mode === 'practice') {
      setTimeout(() => {
        // Record answer silently (no feedback)
        const correctAns = q.answer || '';
        const isCorrect = label === correctAns;
        if (isCorrect) p.score++;
        
        // Update history
        if (!state.history[q.id]) state.history[q.id] = {correct:0, wrong:0, lastTime:''};
        if (isCorrect) state.history[q.id].correct++;
        else state.history[q.id].wrong++;
        state.history[q.id].lastTime = new Date().toISOString();
        
        // Wrong book
        if (!isCorrect) {
          state.wrongBook[q.id] = {module: q.module, question: q.question, answer: correctAns, type: q.type, timestamp: Date.now()};
        } else if (state.wrongBook[q.id]) {
          delete state.wrongBook[q.id];
        }
        
        // Daily stats
        const today = new Date().toISOString().slice(0,10);
        if (!state.dailyStats[today]) state.dailyStats[today] = {total:0, correct:0};
        state.dailyStats[today].total++;
        if (isCorrect) state.dailyStats[today].correct++;
        
        saveState();
        
        // Auto-advance
        p.currentIdx++;
        if (p.currentIdx >= p.total) {
          endPractice();
        } else {
          renderQNav();
          renderQuiz();
        }
      }, 200);
    }
  }
}

  else state.history[q.id].wrong++;
  state.history[q.id].lastTime = new Date().toISOString();
  
  // Wrong book
  if (!isCorrect) {
    state.wrongBook[q.id] = {module: q.module, question: q.question, answer: correctAns, type: q.type, timestamp: Date.now()};
  } else if (state.wrongBook[q.id]) {

  }

function nextQuestion() {

  document.getElementById('quiz-feedback').innerHTML = '';

  if (p.currentIdx >= p.total) {
    endPractice();
    return;
  }
  const isAnswered = p.answers[p.currentIdx] !== undefined;
  const isPractice = p.mode === 'practice';
  document.getElementById('btn-submit').style.display = (!isAnswered && !isPractice) ? '' : 'none';
  document.getElementById('btn-submit-mul').style.display = 'none';
  document.getElementById('btn-next').style.display = isAnswered ? '' : 'none';

function prevQuestion() {

function jumpTo(idx) {

  document.getElementById('quiz-feedback').innerHTML = '';
  const p = state.practice;
  const isAnswered = p.answers[idx] !== undefined;
  const isPractice = p.mode === 'practice';
  const q = p.questions[idx];
  const isMulti = q.type === 'multi';
  document.getElementById('btn-submit').style.display = (!isAnswered && !isPractice) ? '' : 'none';
  document.getElementById('btn-submit-mul').style.display = (!isAnswered && isPractice && isMulti) ? '' : 'none';
  document.getElementById('btn-next').style.display = isAnswered ? '' : 'none';
  document.getElementById('btn-prev').style.display = idx > 0 ? '' : 'none';
  renderQNav();
  renderQuiz();
}

function toggleFav() {
  const q = state.practice.questions[state.practice.currentIdx];
  const note = document.getElementById('fav-note').value;
  if (state.favorites[q.id]) {
    delete state.favorites[q.id];
  } else {
    state.favorites[q.id] = note || true;
  }
  saveState();
  renderQuiz();
}
document.getElementById('fav-note').addEventListener('input', function() {
  const q = state.practice.questions[state.practice.currentIdx];
  if (q && state.favorites[q.id]) {
    state.favorites[q.id] = this.value;
    saveState();
  }
});

function endPractice() {
  const p = state.practice;
  if (p.total === 0) return;
  const answered = Object.keys(p.answers).length;
  const rate = answered > 0 ? Math.round(p.score/answered*100) : 0;
  
  document.getElementById('modal-title').textContent = p.mode === 'practice' ? '练习完成' : '本轮练习结束';
  document.getElementById('modal-score').textContent = `${p.score}/${answered} (${rate}%)`;
  
  let detailHtml = `
    <p>共${p.total}题，作答${answered}题，正确${p.score}题</p>
    <div class="score-bar" style="margin-top:8px"><div class="score-fill" style="width:${rate}%;background:${rate>=60?'var(--green)':'var(--red)'}"></div></div>`;
  
  // In practice mode, add explanation buttons
  if (p.mode === 'practice') {
    const wrongCount = answered - p.score;
    detailHtml += `
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-gold btn-sm" onclick="showPracticeReview('all')">查看全部解析</button>
        <button class="btn btn-outline btn-sm" onclick="showPracticeReview('wrong')">只看错题解析 (${wrongCount})</button>
        <button class="btn btn-outline btn-sm" onclick="closeModal()">关闭</button>
      </div>`;
  }
  
  document.getElementById('modal-detail').innerHTML = detailHtml;
  document.getElementById('result-modal').classList.add('show');
  
  state.practice.completed = true;
}

function showPracticeReview(filter) {
  const p = state.practice;
  closeModal();
  
  let html = '<div style="margin-bottom:16px"><button class="btn btn-outline btn-sm" onclick="switchTab(\'practice\')">返回答题</button></div>';
  html += `<h2>练习解析 ${filter === 'wrong' ? '（仅错题）' : '（全部）'}</h2>`;
  
  let count = 0;
  for (let i = 0; i < p.total; i++) {
    const q = p.questions[i];
    const userAns = p.answers[i] || '未作答';
    const correctAns = q.answer || '';
    const isCorrect = userAns === correctAns;
    
    // Skip correct ones if filter is 'wrong'
    if (filter === 'wrong' && isCorrect) continue;
    
    count++;
    const labels = q.type === 'multi' ? ['A','B','C','D','E'] : ['A','B','C','D'];
    let optHtml = '';
    labels.forEach(l => {
      if (!q.options[l]) return;
      let color = 'var(--text-dim)';
      if (correctAns.includes(l)) color = 'var(--green)';
      else if (userAns.includes(l)) color = 'var(--red)';
      optHtml += `<div style="font-size:13px;color:${color};margin-left:12px;margin-top:2px">${l}. ${q.options[l]}${correctAns.includes(l) ? ' ✓' : ''}${userAns.includes(l) && !correctAns.includes(l) ? ' ✗' : ''}</div>`;
    });
    
    html += `<div class="card" style="margin-bottom:12px;padding:12px">
      <div style="font-size:14px;margin-bottom:6px"><strong>${i+1}.</strong> ${q.question} <span class="tag tag-${q.type==='multi'?'multi':'single'}">${q.type==='multi'?'多选':'单选'}</span> ${isCorrect ? '<span style="color:var(--green)">✓ 正确</span>' : '<span style="color:var(--red)">✗ 错误</span>'}</div>
      ${optHtml}
      <div style="margin-top:6px;font-size:13px;color:var(--gold)">你的答案: ${userAns} | 正确答案: ${correctAns}</div>
      ${q.explanation ? `<div style="margin-top:6px;font-size:13px;color:var(--text-dim);line-height:1.5;padding:8px;background:rgba(255,255,255,0.05);border-radius:6px">${q.explanation}</div>` : ''}
    </div>`;
  }
  
  if (count === 0) {
    html += '<div class="empty-state"><p>没有错题，全部正确！🎉</p></div>';
  }
  
  html += `<div style="margin-top:16px"><button class="btn btn-gold" onclick="switchTab(\'practice\')">继续答题</button></div>`;
  
  document.getElementById('quiz-area').innerHTML = html;
  document.getElementById('quiz-feedback').innerHTML = '';
  document.getElementById('q-nav').innerHTML = '';
  document.getElementById('q-progress').textContent = '';
  // Hide all buttons
  ['btn-submit','btn-submit-mul','btn-next','btn-prev','btn-fav','btn-end'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
  document.getElementById('fav-note').style.display = 'none';
}

function closeModal() {
  document.getElementById('result-modal').classList.remove('show');
}

// ====== EXAM ======
function getPaperByYear(year) {
  return EXAM_DATA.find(p => p.year === year || p.code === year);
}

function renderExamList() {
  if (!dataLoaded) return;
  let html = '';
  EXAM_DATA.forEach(p => {
    const label = p.label || p.year;
    const supp = p.isSupplementary ? ' (补充卷)' : '';
    const best = state.examHistory[p.year] ? Math.max(...state.examHistory[p.year].scores) : null;
    const times = state.examHistory[p.year] ? state.examHistory[p.year].scores.length : 0;
    html += `<div class="year-card" onclick="showExamDetail('${p.year}','${p.code || p.year}')">
      <div class="year">${label}${supp}</div>
      <div class="info">${p.totalQuestions}题 | 单选${p.singleChoice}+多选${p.multiChoice}</div>
      ${best !== null ? `<div class="info">最佳成绩: ${best}分 | 已考${times}次</div>` : '<div class="info">未考试</div>'}
    </div>`;
  });
  document.getElementById('exam-list').innerHTML = html;
  document.getElementById('exam-area').innerHTML = '';
  document.getElementById('exam-review').innerHTML = '';
}

function showExamDetail(year, code) {
  const paper = getPaperByYear(code) || getPaperByYear(year);
  if (!paper) return;
  
  document.getElementById('exam-area').innerHTML = `
    <div class="card">
      <h2>${paper.label || paper.year} 模拟考试</h2>
      <p style="color:var(--text-dim);margin-bottom:12px">${paper.totalQuestions}题 | 单选${paper.singleChoice}题 + 多选${paper.multiChoice}题 | 限时120分钟</p>
      <button class="btn btn-gold" onclick="startExam('${code || year}')">开始模拟考试</button>
      <button class="btn btn-outline" onclick="browseExam('${code || year}')" style="margin-left:10px">浏览题目</button>
      ${state.examHistory[year] ? `<button class="btn btn-outline" onclick="reviewExam('${year}')" style="margin-left:10px">查看上次考试</button>` : ''}
    </div>`;
  document.getElementById('exam-review').innerHTML = '';
}

function startExam(key) {
  const paper = getPaperByYear(key);
  if (!paper) return;
  
  state.examActive = {
    paper: paper,
    questions: paper.questions,
    answers: {},
    startTime: Date.now(),
    timeLimit: 120 * 60, // 120 minutes
    currentIdx: 0,
    total: paper.totalQuestions
  };
  
  renderExamQuiz();
  startTimer();
}

function startTimer() {
  const updateTimer = () => {
    if (!state.examActive) return;
    const elapsed = Math.floor((Date.now() - state.examActive.startTime) / 1000);
    const remaining = state.examActive.timeLimit - elapsed;
    if (remaining <= 0) {
      submitExam();
      return;
    }
    const mins = Math.floor(remaining / 60);
    const secs = remaining % 60;
    const timerEl = document.getElementById('exam-timer');
    if (timerEl) {
      timerEl.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
      if (remaining < 300) timerEl.classList.add('warning');
    }
  };
  updateTimer();
  state._examTimer = setInterval(updateTimer, 1000);
}

function renderExamQuiz() {
  if (!state.examActive) return;
  const ea = state.examActive;
  const q = ea.questions[ea.currentIdx];
  
  let navHtml = '';
  for (let i = 0; i < ea.total; i++) {
    let cls = 'q-dot';
    if (i === ea.currentIdx) cls += ' current';
    if (ea.answers[i] !== undefined) cls += ' answered';
    navHtml += `<span class="${cls}" onclick="examJumpTo(${i})">${i+1}</span>`;
  }
  
  document.getElementById('exam-area').innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <h2>${ea.paper.label || ea.paper.year} · 模拟考试</h2>
        <div class="timer" id="exam-timer">120:00</div>
      </div>
      <div class="question-nav">${navHtml}</div>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px">第 ${ea.currentIdx+1}/${ea.total} 题 · ${q.type === 'multi' ? '多选题' : '单选题'}</div>
      <div id="exam-quiz-area"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
        <button class="btn btn-outline btn-sm" onclick="examPrev()" ${ea.currentIdx===0?'disabled':''}>⬅ 上一题</button>
        <button class="btn btn-outline btn-sm" onclick="examNext()">下一题 ➡</button>
        <button class="btn btn-red btn-sm" onclick="submitExam()">交 卷</button>
      </div>
    </div>`;
  
  renderExamQuestion();
}

function renderExamQuestion() {
  if (!state.examActive) return;
  const ea = state.examActive;
  const q = ea.questions[ea.currentIdx];
  const userAns = ea.answers[ea.currentIdx] || '';
  const isMulti = q.type === 'multi';
  
  let html = `<div style="font-size:15px;line-height:1.6;margin-bottom:16px">${q.question}</div>`;
  const labels = isMulti ? ['A','B','C','D','E'] : ['A','B','C','D'];
  labels.forEach(l => {
    if (!q.options[l]) return;
    const selected = userAns.includes(l);
    html += `<div class="option${selected ? ' selected' : ''}" onclick="examSelect('${l}')">${l}. ${q.options[l]}</div>`;
  });
  document.getElementById('exam-quiz-area').innerHTML = html;
}

function examSelect(label) {
  if (!state.examActive) return;
  const ea = state.examActive;
  const q = ea.questions[ea.currentIdx];
  const isMulti = q.type === 'multi';
  
  if (isMulti) {
    const current = ea.answers[ea.currentIdx] || '';
    if (current.includes(label)) {
      ea.answers[ea.currentIdx] = current.replace(label, '');
    } else {
      ea.answers[ea.currentIdx] = (current + label).split('').sort().join('');
    }
  } else {
    ea.answers[ea.currentIdx] = label;
  }
  renderExamQuestion();
  // Update nav
  const nav = document.querySelector('#exam-area .question-nav');
  if (nav) {
    const dots = nav.querySelectorAll('.q-dot');
    dots[ea.currentIdx].classList.toggle('answered', !!ea.answers[ea.currentIdx]);
  }
}

function examPrev() {
  if (!state.examActive || state.examActive.currentIdx <= 0) return;
  state.examActive.currentIdx--;
  renderExamQuiz();
}

function examNext() {
  if (!state.examActive) return;
  state.examActive.currentIdx++;
  if (state.examActive.currentIdx >= state.examActive.total) {
    state.examActive.currentIdx = state.examActive.total - 1;
    return;
  }
  renderExamQuiz();
}

function examJumpTo(idx) {
  if (!state.examActive) return;
  state.examActive.currentIdx = idx;
  renderExamQuiz();
}

function submitExam() {
  if (!state.examActive) return;
  if (!confirm('确定要交卷吗？')) return;
  
  clearInterval(state._examTimer);
  const ea = state.examActive;
  const elapsed = Math.floor((Date.now() - ea.startTime) / 1000);
  
  let score = 0;
  let answered = 0;
  const wrongQuestions = [];
  
  ea.questions.forEach((q, i) => {
    const userAns = ea.answers[i] || '';
    if (!userAns) return;
    answered++;
    if (userAns === q.answer) {
      score++;
    } else {
      wrongQuestions.push({...q, id: `exam_${ea.paper.year}_${q.num}`, userAnswer: userAns});
      // Add to wrong book
      state.wrongBook[`exam_${ea.paper.year}_${q.num}`] = {
        module: '历年真题',
        question: q.question,
        answer: q.answer,
        type: q.type,
        userAnswer: userAns,
        timestamp: Date.now()
      };
    }
  });
  
  // Save history
  const year = ea.paper.year;
  if (!state.examHistory[year]) state.examHistory[year] = {scores:[], times:[]};
  state.examHistory[year].scores.push(score);
  state.examHistory[year].times.push(new Date().toISOString());
  
  // Daily stats
  const today = new Date().toISOString().slice(0,10);
  if (!state.dailyStats[today]) state.dailyStats[today] = {total:0, correct:0};
  state.dailyStats[today].total += answered;
  state.dailyStats[today].correct += score;
  
  saveState();
  
  const rate = answered > 0 ? Math.round(score/answered*100) : 0;
  const mins = Math.floor(elapsed/60);
  const secs = elapsed % 60;
  
  document.getElementById('modal-title').textContent = '考试结束';
  document.getElementById('modal-score').textContent = score + '分';
  document.getElementById('modal-detail').innerHTML = `
    <p>共${ea.total}题，作答${answered}题，正确${score}题</p>
    <p style="color:var(--text-dim)">正确率: ${rate}% | 用时: ${mins}分${secs}秒</p>
    <div class="score-bar"><div class="score-fill" style="width:${rate}%;background:${rate>=60?'var(--green)':'var(--red)'}"></div></div>
    ${wrongQuestions.length > 0 ? `<p style="margin-top:12px;color:var(--red)">${wrongQuestions.length}道错题已加入错题本</p>` : ''}
    <button class="btn btn-blue btn-sm" onclick="closeModal();reviewLastExam()" style="margin-top:12px">查看错题解析</button>`;
  document.getElementById('result-modal').classList.add('show');
  
  state._lastExamWrong = wrongQuestions;
  state.examActive = null;
  renderExamList();
}

function reviewExam(year) {
  if (state._lastExamWrong && state._lastExamWrong.length > 0) {
    reviewLastExam();
  }
}

function reviewLastExam() {
  if (!state._lastExamWrong || state._lastExamWrong.length === 0) {
    document.getElementById('exam-review').innerHTML = '<div class="card"><p>没有需要复习的错题</p></div>';
    return;
  }
  let html = '<div class="card"><h2>错题回顾</h2>';
  state._lastExamWrong.forEach(q => {
    const ans = q.answer || '';
    const ua = q.userAnswer || '';
    html += `<div class="exam-review-q wrong-r">
      <div style="font-size:14px;margin-bottom:8px">${q.question}</div>
      <div style="color:var(--red);font-size:13px">你的答案: ${ua} | 正确答案: ${ans}</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('exam-review').innerHTML = html;
}

function browseExam(key) {
  const paper = getPaperByYear(key);
  if (!paper) return;
  
  let html = `<div class="card"><h2>${paper.label || paper.year} · 浏览学习</h2>`;
  paper.questions.forEach((q, i) => {
    html += `<div class="exam-review-q" style="margin-bottom:12px">
      <div style="font-size:14px;margin-bottom:8px"><strong>${q.num}. </strong>${q.question} <span class="tag tag-${q.type==='multi'?'multi':'single'}">${q.type==='multi'?'多选':'单选'}</span></div>
      ${Object.entries(q.options).map(([k,v]) => `<div style="font-size:13px;color:var(--text-dim);margin-left:12px">${k}. ${v}</div>`).join('')}
      <div style="margin-top:4px;color:var(--gold);font-size:13px">正确答案: ${q.answer || '暂无'}</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('exam-review').innerHTML = html;
}

// ====== WRONG BOOK ======
function renderWrongBook() {
  const ids = Object.keys(state.wrongBook);
  if (ids.length === 0) {
    document.getElementById('wrong-content').innerHTML = '<div class="empty-state">暂无错题，继续加油！</div>';
    return;
  }
  
  // Group by module
  const grouped = {};
  ids.forEach(id => {
    const w = state.wrongBook[id];
    const mod = w.module || '其他';
    if (!grouped[mod]) grouped[mod] = [];
    grouped[mod].push({id, ...w});
  });
  
  let html = '';
  for (const [mod, items] of Object.entries(grouped)) {
    html += `<h3 style="margin-top:16px">${mod} (${items.length}题)</h3>`;
    items.forEach(item => {
      html += `<div style="padding:12px;background:var(--bg-card2);border-radius:8px;margin-bottom:8px;border-left:3px solid var(--red)">
        <div style="font-size:14px;margin-bottom:4px">${item.question}</div>
        <div style="color:var(--gold);font-size:13px">正确答案: ${item.answer}</div>
        <button class="btn btn-outline btn-sm" onclick="retryWrong('${item.id}')" style="margin-top:4px">重新练习</button>
        <button class="btn btn-outline btn-sm" onclick="removeWrong('${item.id}')" style="margin-left:4px">移除</button>
      </div>`;
    });
  }
  document.getElementById('wrong-content').innerHTML = html;
}

function retryWrong(id) {
  document.getElementById('filter-mode').value = 'wrong';
  startPractice();
}

function removeWrong(id) {
  delete state.wrongBook[id];
  saveState();
  renderWrongBook();
}

// ====== FAVORITES ======
function renderFavorites() {
  const ids = Object.keys(state.favorites);
  if (ids.length === 0) {
    document.getElementById('fav-content').innerHTML = '<div class="empty-state">暂无收藏题目，在答题时点击 ⭐ 即可收藏</div>';
    return;
  }
  
  let html = '';
  ids.forEach(id => {
    const fav = state.favorites[id];
    const note = typeof fav === 'string' ? fav : '';
    // Find question in QUIZ_DATA
    const q = QUIZ_DATA.find(qq => qq.id === id);
    if (q) {
      html += `<div style="padding:12px;background:var(--bg-card2);border-radius:8px;margin-bottom:8px;border-left:3px solid var(--gold)">
        <div style="font-size:14px;margin-bottom:4px">${q.question}</div>
        <div style="color:var(--gold);font-size:13px">答案: ${q.answer || '暂无'}</div>
        ${note ? `<div class="note-inline">📝 ${note}</div>` : ''}
        <button class="btn btn-outline btn-sm" onclick="removeFav('${id}')" style="margin-top:4px">取消收藏</button>
      </div>`;
    }
  });
  document.getElementById('fav-content').innerHTML = html || '<div class="empty-state">收藏的题目在题库中未找到</div>';
}

function removeFav(id) {
  delete state.favorites[id];
  saveState();
  renderFavorites();
}

// ====== STATS ======
function renderStats() {
  if (!dataLoaded) return;
  const modules = {};
  QUIZ_DATA.forEach(q => {
    const m = q.module || '其他';
    if (!modules[m]) modules[m] = {total:0, correct:0, wrong:0};
    modules[m].total++;
    const h = state.history[q.id];
    if (h) { modules[m].correct += h.correct; modules[m].wrong += h.wrong; }
  });
  
  let html = '<h3>模块掌握情况</h3>';
  for (const [name, data] of Object.entries(modules)) {
    const answered = data.correct + data.wrong;
    const pct = answered > 0 ? Math.round(data.correct/answered*100) : 0;
    const progressPct = data.total > 0 ? Math.round(answered/data.total*100) : 0;
    html += `<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:4px">
        <span style="font-weight:600">${name}</span>
        <span style="color:var(--text-dim)">已做 ${answered}/${data.total} 题 · 正确率 <span style="color:${pct>=80?'var(--green)':pct>=60?'var(--gold)':'var(--red)'};font-weight:600">${pct}%</span></span>
      </div>
      <div class="score-bar" style="position:relative">
        <div class="score-fill" style="width:${Math.max(pct,3)}%;background:${pct>=80?'var(--green)':pct>=60?'var(--gold)':'var(--red)'}"></div>
        <div style="position:absolute;top:0;left:0;height:100%;width:${progressPct}%;background:rgba(255,255,255,.06);border-radius:4px"></div>
      </div>
    </div>`;
  }
  
  // Exam history
  html += '<h3 style="margin-top:24px">模拟考试记录</h3>';
  if (Object.keys(state.examHistory).length === 0) {
    html += '<p style="color:var(--text-dim)">暂无考试记录</p>';
  } else {
    for (const [year, data] of Object.entries(state.examHistory)) {
      const best = Math.max(...data.scores);
      html += `<div style="padding:8px 12px;background:var(--bg-card2);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between">
        <span>${year}年</span>
        <span>最佳: ${best}分 | 共${data.scores.length}次</span>
      </div>`;
    }
  }
  
  document.getElementById('stats-content').innerHTML = html;
}

// ====== KEYBOARD ======
document.addEventListener('keydown', e => {
  if (state.examActive) {
    if (e.key === 'ArrowLeft') examPrev();
    if (e.key === 'ArrowRight') examNext();
    return;
  }
  
  if (e.key === 'Enter') {
    if (document.getElementById('btn-submit').style.display !== 'none') {
      submitAnswer();
    } else if (document.getElementById('btn-submit-mul').style.display !== 'none') {
      submitMultiAnswer();
    } else if (document.getElementById('btn-next').style.display !== 'none') {
      nextQuestion();
    }
  } else if (e.key === 'ArrowRight' && document.getElementById('btn-next').style.display !== 'none') {
    nextQuestion();
  } else if (e.key === 'ArrowLeft' && document.getElementById('btn-prev').style.display !== 'none') {
    prevQuestion();
  }
});

// ====== KNOWLEDGE POINTS ======
let KNOWLEDGE_DATA = [];
let kpPageSize = 20;
let kpCurrentPage = 1;
let kpFilterModule = '';
let kpFilterMastery = '';

async function loadKnowledge() {
  if (KNOWLEDGE_DATA.length === 0) {
    try {
      const resp = await fetch('knowledge.json');
      if (!resp.ok) throw new Error('Failed to load knowledge data');
      KNOWLEDGE_DATA = await resp.json();
    } catch(e) {
      document.getElementById('kp-cards').innerHTML = '<p style="padding:40px;text-align:center;color:var(--text-dim)">知识点数据加载中，请稍后刷新...</p>';
      return;
    }
  }
  kpFilterModule = document.getElementById('kp-module').value;
  kpFilterMastery = document.getElementById('kp-mastery').value;
  kpCurrentPage = 1;
  renderKnowledgeCards();
  populateKpModules();
  updateKpProgress();
}

function populateKpModules() {
  const modules = [...new Set(KNOWLEDGE_DATA.map(k => k.module))].sort();
  const sel = document.getElementById('kp-module');
  sel.innerHTML = '<option value="">全部</option>' + modules.map(m => `<option value="${m}">${m}</option>`).join('');
}

function renderKnowledgeCards() {
  let data = KNOWLEDGE_DATA;
  if (kpFilterModule) data = data.filter(k => k.module === kpFilterModule);
  if (kpFilterMastery === 'mastered') data = data.filter(k => state.knowledgeMastered[k.id]);
  if (kpFilterMastery === 'unmastered') data = data.filter(k => !state.knowledgeMastered[k.id]);
  
  const totalPages = Math.ceil(data.length / kpPageSize);
  const start = (kpCurrentPage - 1) * kpPageSize;
  const pageData = data.slice(start, start + kpPageSize);
  
  let html = '';
  for (const kp of pageData) {
    const mastered = state.knowledgeMastered[kp.id];
    const cls = mastered ? 'mastered' : '';
    const badge = mastered ? '✅ 已掌握' : '';
    html += `<div class="kp-card ${cls}" id="kp-${kp.id}" onclick="toggleKpCard('${kp.id}', event)">
      <div class="kp-question">${kp.question}</div>
      <div class="kp-answer">${kp.answer}</div>
      <div class="kp-meta">
        <span class="kp-badge">${kp.module}</span>
        ${kp.submodule ? `<span class="kp-badge">${kp.submodule}</span>` : ''}
        ${badge ? `<span class="kp-badge" style="background:var(--green);color:#fff">${badge}</span>` : ''}
        ${kp.keywords ? kp.keywords.slice(0,3).map(k => `<span class="kp-badge">${k}</span>`).join('') : ''}
        <span class="kp-actions" style="margin-left:auto" onclick="event.stopPropagation()">
          <button class="btn btn-outline btn-sm" onclick="toggleMastered('${kp.id}')">${mastered?'取消掌握':'标记掌握'}</button>
        </span>
      </div>
    </div>`;
  }
  
  if (!pageData.length) {
    html = '<p style="padding:40px;text-align:center;color:var(--text-dim)">暂无匹配的知识点</p>';
  }
  
  document.getElementById('kp-cards').innerHTML = html;
  
  // Pagination
  let pagerHtml = '';
  if (totalPages > 1) {
    pagerHtml = `<button class="btn btn-outline btn-sm" onclick="kpPage(${kpCurrentPage-1})" ${kpCurrentPage<=1?'disabled':''}>上一页</button>
      <span style="margin:0 10px;font-size:13px">${kpCurrentPage} / ${totalPages}</span>
      <button class="btn btn-outline btn-sm" onclick="kpPage(${kpCurrentPage+1})" ${kpCurrentPage>=totalPages?'disabled':''}>下一页</button>`;
  }
  document.getElementById('kp-pager').innerHTML = pagerHtml;
}

function toggleKpCard(id, event) {
  const card = document.getElementById('kp-' + id);
  if (!card) return;
  // Don't toggle if clicking on the action button
  if (event.target.tagName === 'BUTTON') return;
  card.classList.toggle('open');
}

function toggleMastered(id) {
  if (state.knowledgeMastered[id]) {
    delete state.knowledgeMastered[id];
  } else {
    state.knowledgeMastered[id] = true;
  }
  saveState();
  renderKnowledgeCards();
  updateKpProgress();
}

function kpPage(page) {
  kpCurrentPage = Math.max(1, page);
  renderKnowledgeCards();
}

function updateKpProgress() {
  const total = KNOWLEDGE_DATA.length;
  const mastered = Object.keys(state.knowledgeMastered).length;
  const el = document.getElementById('kp-progress');
  if (el) el.innerHTML = `已掌握: ${mastered}/${total} (${total>0?Math.round(mastered/total*100):0}%)`;
}

// ====== INIT ======
loadData();
</script>
</body>
</html>
